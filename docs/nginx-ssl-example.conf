# Example: Burnbox behind nginx, with HTTPS and a password on uploads only.
#
# Burnbox settings that go with this file:
#   BURNBOX_IFACE=127.0.0.1          only nginx can reach Burnbox
#   BURNBOX_TRUST_PROXY=1            believe the visitor address nginx passes along
#   BURNBOX_UPLOAD_APP_PATH=/up/     move the upload page and upload endpoint to /up/
#
# With that, /up/ (where people upload) asks for a username and password, while download
# links (/<id> and /files/...) stay open, so the people you send links to need no login.
# If you would rather everything is open, drop the auth lines. If you would rather not
# use nginx logins at all, set BURNBOX_UPLOAD_PASS instead (Burnbox's own upload password).
#
# Create the password file (you will be asked for the password):
#   sudo sh -c 'echo "alice:$(openssl passwd -apr1)" >> /etc/nginx/burnbox.htpasswd'

# don't send the nginx version number in error pages and Server header
server_tokens off;

# redirect all http traffic to https
server {
  listen 80;
  server_name transfer.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name transfer.example.com;

  error_log  /var/log/nginx/transfer-error.log warn;
  access_log /var/log/nginx/transfer-access.log;

  ### SSL ###
  ssl_certificate /etc/nginx/certs/transfer.example.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/transfer.example.com/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;

  ### Large files ###
  # Burnbox uploads in 5 MB pieces, and nginx refuses anything over 1 MB by default
  # ("413 Request Entity Too Large"). Burnbox sets its own limits (BURNBOX_MAX_FILE_SIZE).
  client_max_body_size 0;
  # Stream in both directions instead of buffering whole files on disk.
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  # Slow connections: allow long gaps between pieces.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  send_timeout 3600s;

  proxy_set_header Host $http_host;
  # Pass the visitor's address and scheme to Burnbox. Needed for the per-visitor limits.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Uploads: needs a login. Remove the two auth lines to leave uploads open.
  location /up/ {
    auth_basic "Burnbox uploads";
    auth_basic_user_file /etc/nginx/burnbox.htpasswd;
    proxy_pass "http://127.0.0.1:3000";
  }

  # Everything else (download links, the admin page, assets): open.
  # The admin page has its own password (BURNBOX_ADMIN_PASS).
  location / {
    proxy_pass "http://127.0.0.1:3000";
  }
}
